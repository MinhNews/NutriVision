<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>NutriVision — bộ icon</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 32px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #F8FAFC; color: #0F172A;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; color: #64748B; font-size: 14px; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 32px; }
  .item { text-align: center; }
  .item span { display: block; margin-top: 10px; font-size: 12px; color: #64748B; }
  .icon { display: block; overflow: hidden; }
  .round { border-radius: 50%; }
  .squircle { border-radius: 22.5%; }
  .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; }
  .dark { background: #0B1220; border-color: #1E293B; }
  .mono { background: #0B1220; border-radius: 22.5%; padding: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #64748B; margin: 0 0 14px; font-weight: 600; }
</style>
</head>
<body>

<h1>NutriVision — icon &amp; logo</h1>
<p class="sub">Lá xanh trên nền gradient, tia sáng nhỏ cho “vision”. Màu lấy từ bảng màu của app (#0E9D6B → #17BE84, lá trắng, nhấn #A3E635).</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A7551"/>
      <stop offset="0.55" stop-color="#0E9D6B"/>
      <stop offset="1" stop-color="#17BE84"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <symbol id="nv" viewBox="0 0 108 108">
      <rect width="108" height="108" fill="url(#bg)"/>
      <rect width="108" height="108" fill="url(#glow)"/>
      <circle cx="61" cy="61" r="27" fill="#A3E635" opacity="0.14"/>
      <path d="M36,76 C33,52 47,35 73,31 C75,57 63,74 36,76 Z" fill="#FFFFFF"/>
      <path d="M37,75 C44,66 54,54 66,41" fill="none" stroke="#0E9D6B" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <path d="M36,76 C34,80 32,83 29,86" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M79,23.4 C79.6,26.2 81.4,28 84.2,28.6 C81.4,29.2 79.6,31 79,33.8 C78.4,31 76.6,29.2 73.8,28.6 C76.6,28 78.4,26.2 79,23.4 Z" fill="#FFFFFF" opacity="0.85"/>
    </symbol>
    <symbol id="nv-mono" viewBox="0 0 108 108">
      <path d="M36,76 C33,52 47,35 73,31 C75,57 63,74 36,76 Z" fill="#FFFFFF"/>
      <path d="M36,76 C34,80 32,83 29,86" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M79,23.4 C79.6,26.2 81.4,28 84.2,28.6 C81.4,29.2 79.6,31 79,33.8 C78.4,31 76.6,29.2 73.8,28.6 C76.6,28 78.4,26.2 79,23.4 Z" fill="#FFFFFF"/>
    </symbol>
  </defs>
</svg>

<h2>Kích thước thật</h2>
<div class="row">
  <div class="item">
    <svg class="icon squircle" width="160" height="160"><use href="#nv"/></svg>
    <span>160 px (squircle)</span>
  </div>
  <div class="item">
    <svg class="icon round" width="120" height="120"><use href="#nv"/></svg>
    <span>120 px (tròn)</span>
  </div>
  <div class="item">
    <svg class="icon squircle" width="72" height="72"><use href="#nv"/></svg>
    <span>72 px</span>
  </div>
  <div class="item">
    <svg class="icon squircle" width="48" height="48"><use href="#nv"/></svg>
    <span>48 px (launcher)</span>
  </div>
  <div class="item">
    <svg width="32" height="32"><use href="#nv"/></svg>
    <span>32 px</span>
  </div>
  <div class="item">
    <svg width="24" height="24"><use href="#nv"/></svg>
    <span>24 px</span>
  </div>
</div>

<h2>Trên nền sáng / tối</h2>
<div class="row">
  <div class="card item">
    <svg class="icon squircle" width="96" height="96"><use href="#nv"/></svg>
    <span>nền sáng</span>
  </div>
  <div class="card dark item">
    <svg class="icon squircle" width="96" height="96"><use href="#nv"/></svg>
    <span style="color:#94A3B8">nền tối</span>
  </div>
  <div class="card item">
    <div class="mono icon squircle" style="width:96px;height:96px;display:flex;align-items:center;justify-content:center">
      <svg width="66" height="66"><use href="#nv-mono"/></svg>
    </div>
    <span>themed icon</span>
  </div>
</div>

</body>
</html>
