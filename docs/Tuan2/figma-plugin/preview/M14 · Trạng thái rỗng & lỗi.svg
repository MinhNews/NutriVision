<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="390" height="844" rx="0" fill="rgba(248,250,252,1)"/><text x="20" y="75" font-family="Inter, Segoe UI, Arial" font-size="20" font-weight="700" fill="rgba(15,23,42,1)" text-anchor="start" xml:space="preserve"><tspan x="20" dy="0">Các trạng thái cần xử lý</tspan></text><rect x="16" y="100" width="350" height="122" rx="14" fill="rgba(255,255,255,1)"/><rect x="16.5" y="100.5" width="349" height="121" rx="14" fill="none" stroke="rgba(238,242,247,1)" stroke-width="1"/><rect x="30" y="130" width="18" height="18" rx="17" fill="rgba(224,231,255,1)"/><g transform="translate(38,138)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/></svg></g><text x="58" y="126.35" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="700" fill="rgba(15,23,42,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">AI không chắc chắn</tspan></text><text x="58" y="143.975" font-family="Inter, Segoe UI, Arial" font-size="10.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">Độ tin cậy dưới 60%: hiện top-3 và nút tìm món thủ</tspan><tspan x="58" dy="15">công thay vì đoán bừa.</tspan></text><rect x="30" y="174" width="322" height="34" rx="10" fill="rgba(236,253,245,1)"/><text x="140.5" y="193.925" font-family="Inter, Segoe UI, Arial" font-size="11.5" font-weight="700" fill="rgba(5,150,105,1)" text-anchor="start" xml:space="preserve"><tspan x="140.5" dy="0">Tìm món thủ công</tspan></text><rect x="16" y="232" width="350" height="122" rx="14" fill="rgba(255,255,255,1)"/><rect x="16.5" y="232.5" width="349" height="121" rx="14" fill="none" stroke="rgba(238,242,247,1)" stroke-width="1"/><rect x="30" y="262" width="18" height="18" rx="17" fill="rgba(236,253,245,1)"/><g transform="translate(38,270)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg></g><text x="58" y="258.35" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="700" fill="rgba(15,23,42,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">Nhật ký trống</tspan></text><text x="58" y="275.975" font-family="Inter, Segoe UI, Arial" font-size="10.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">Ngày mới chưa có món nào. Gợi ý chụp bữa sáng để</tspan><tspan x="58" dy="15">bắt đầu chuỗi ngày.</tspan></text><rect x="30" y="306" width="322" height="34" rx="10" fill="rgba(236,253,245,1)"/><text x="152" y="325.925" font-family="Inter, Segoe UI, Arial" font-size="11.5" font-weight="700" fill="rgba(5,150,105,1)" text-anchor="start" xml:space="preserve"><tspan x="152" dy="0">Chụp bữa sáng</tspan></text><rect x="16" y="364" width="350" height="122" rx="14" fill="rgba(255,255,255,1)"/><rect x="16.5" y="364.5" width="349" height="121" rx="14" fill="none" stroke="rgba(238,242,247,1)" stroke-width="1"/><rect x="30" y="394" width="18" height="18" rx="17" fill="rgba(241,245,249,1)"/><g transform="translate(38,402)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></g><text x="58" y="390.35" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="700" fill="rgba(15,23,42,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">Không tìm thấy món</tspan></text><text x="58" y="407.975" font-family="Inter, Segoe UI, Arial" font-size="10.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">Không có kết quả cho “bánh xèo miền Tây”. Thử từ</tspan><tspan x="58" dy="15">khoá ngắn hơn.</tspan></text><rect x="30" y="438" width="322" height="34" rx="10" fill="rgba(236,253,245,1)"/><text x="163" y="457.925" font-family="Inter, Segoe UI, Arial" font-size="11.5" font-weight="700" fill="rgba(5,150,105,1)" text-anchor="start" xml:space="preserve"><tspan x="163" dy="0">Xóa bộ lọc</tspan></text><rect x="16" y="496" width="350" height="63" rx="14" fill="rgba(255,255,255,1)"/><rect x="16.5" y="496.5" width="349" height="62" rx="14" fill="none" stroke="rgba(238,242,247,1)" stroke-width="1"/><rect x="30" y="518.5" width="18" height="18" rx="17" fill="rgba(236,253,245,1)"/><g transform="translate(38,526.5)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5 9.2 17.3 4 12.1"/></svg></g><text x="58" y="522.35" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="700" fill="rgba(15,23,42,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">Lưu thành công</tspan></text><text x="58" y="539.975" font-family="Inter, Segoe UI, Arial" font-size="10.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="58" dy="0">Snackbar xác nhận, kèm nút hoàn tác trong 5 giây.</tspan></text><rect x="16" y="575" width="358" height="48" rx="12" fill="rgba(11,18,32,1)"/><g transform="translate(32,590)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5 9.2 17.3 4 12.1"/></svg></g><text x="60" y="601.4" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="500" fill="rgba(255,255,255,1)" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Đã thêm vào bữa trưa</tspan></text><text x="302" y="601.4" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="700" fill="rgba(251,191,36,1)" text-anchor="start" xml:space="preserve"><tspan x="302" dy="0">Hoàn tác</tspan></text><rect x="16" y="633" width="358" height="56" rx="12" fill="rgba(254,242,242,1)"/><rect x="16.5" y="633.5" width="357" height="55" rx="12" fill="none" stroke="rgba(254,202,202,1)" stroke-width="1"/><g transform="translate(28,653.5)"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></g><text x="51" y="655.45" font-family="Inter, Segoe UI, Arial" font-size="11" font-weight="400" fill="rgba(185,28,28,1)" text-anchor="start" xml:space="preserve"><tspan x="51" dy="0">Không đọc được model. Kiểm tra lại tệp dinh dưỡng và thử</tspan><tspan x="51" dy="16">lại.</tspan></text></svg>