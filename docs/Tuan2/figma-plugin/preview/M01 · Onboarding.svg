<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="390" height="844" rx="0" fill="rgba(255,255,255,1)"/><defs><linearGradient id="gn1196" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(222,250,240,1)"/><stop offset="0.55" stop-color="rgba(184,240,217,1)"/><stop offset="1" stop-color="rgba(140,222,194,1)"/></linearGradient></defs><rect x="0" y="0" width="390" height="372" rx="0" fill="url(#gn1196)"/><g transform="translate(132,123)"><svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 24 24" fill="none" stroke="#0E9F6E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 3.2v3M12 2.4v3.8M16 3.2v3"/></svg></g><rect x="169" y="396" width="20" height="7" rx="4" fill="rgba(16,185,129,1)"/><rect x="195" y="396" width="7" height="7" rx="4" fill="rgba(226,232,240,1)"/><rect x="208" y="396" width="7" height="7" rx="4" fill="rgba(226,232,240,1)"/><text x="24" y="450.6" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="700" fill="rgba(15,23,42,1)" text-anchor="start" xml:space="preserve"><tspan x="24" dy="0">Ăn uống thông minh,</tspan><tspan x="24" dy="36">ngay từ bữa đầu tiên</tspan></text><text x="24" y="525.775" font-family="Inter, Segoe UI, Arial" font-size="14.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="24" dy="0">Chụp ảnh món ăn, NutriVision nhận diện ngay trên</tspan><tspan x="24" dy="22">máy và cho bạn biết calo, đạm, carb, béo — không</tspan><tspan x="24" dy="22">cần mạng.</tspan></text><rect x="24" y="599" width="16" height="16" rx="15" fill="rgba(236,253,245,1)"/><g transform="translate(31,606)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.8-3h6.4L17 7h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13.5" r="3.6"/></svg></g><text x="50" y="609.875" font-family="Inter, Segoe UI, Arial" font-size="12.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="50" dy="0">Nhận diện 15 món Việt bằng model trên thiết bị</tspan></text><rect x="24" y="636" width="16" height="16" rx="15" fill="rgba(236,253,245,1)"/><g transform="translate(31,643)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg></g><text x="50" y="637.875" font-family="Inter, Segoe UI, Arial" font-size="12.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="50" dy="0">Khẩu phần theo tô, bát, cái — đúng cách ăn của người</tspan><tspan x="50" dy="18">Việt</tspan></text><rect x="24" y="673" width="16" height="16" rx="15" fill="rgba(236,253,245,1)"/><g transform="translate(31,680)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></g><text x="50" y="683.875" font-family="Inter, Segoe UI, Arial" font-size="12.5" font-weight="400" fill="rgba(100,116,139,1)" text-anchor="start" xml:space="preserve"><tspan x="50" dy="0">Dữ liệu nằm trên máy bạn, không gửi lên máy chủ</tspan></text><rect x="24" y="726" width="342" height="52" rx="14" fill="rgba(16,185,129,1)"/><text x="151.5" y="755.3" font-family="Inter, Segoe UI, Arial" font-size="14" font-weight="700" fill="rgba(255,255,255,1)" text-anchor="start" xml:space="preserve"><tspan x="151.5" dy="0">Bắt đầu ngay</tspan></text><te